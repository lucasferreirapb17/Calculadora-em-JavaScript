<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora do Luquinha</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculadora">
        <div class="display">
            <input type="text" id="display" disabled value="0">
        </div>

        <div class="teclado">
            <button id="limpar">C</button>
            <button id="apagar">←</button>
            <button id="porcentagem">%</button>
            <button class="operador">÷</button>

            <button class="numero">7</button>
            <button class="numero">8</button>
            <button class="numero">9</button>
            <button class="operador">x</button>

            <button class="numero">4</button>
            <button class="numero">5</button>
            <button class="numero">6</button>
            <button class="operador">-</button>

            <button class="numero">1</button>
            <button class="numero">2</button>
            <button class="numero">3</button>
            <button class="operador">+</button>

            <button class="numero" id="zero">0</button>
            <button id="ponto">.</button>
            <button id="igual">=</button>
        </div>
    </div>
    
</body>
</html>
